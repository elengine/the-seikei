name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 文書だけの変更では公開しない (公開のたびに新しい版が届き、切り替えの最中の版が捨てられることがあるため。PU-19a)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'PROGRESS.json'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
